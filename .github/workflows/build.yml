name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the DLL to a Release on tag builds

env:
  # vcpkg binary cache so OpenCV is built once and reused on later runs.
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache
  VCPKG_DEFAULT_TRIPLET: x86-windows-static

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare vcpkg binary-cache dir
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          # bump the suffix to invalidate (e.g. when features change)
          key: vcpkg-opencv4-min-x86-static-v2-${{ runner.os }}

      # Pin the manifest baseline to this runner's vcpkg checkout so the
      # manifest install resolves without a hand-picked commit SHA.
      - name: Pin vcpkg baseline
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" x-update-baseline --add-initial-baseline

      # Configure triggers a manifest-mode vcpkg install of the MINIMAL OpenCV
      # declared in vcpkg.json (core/imgproc/imgcodecs+png, no dnn -> no
      # protobuf), then configures the x86 static build. Static OpenCV ->
      # MVision.dll is self-contained (no OpenCV runtime DLLs).
      - name: Configure (x86, static, minimal OpenCV via vcpkg manifest)
        shell: pwsh
        run: |
          cmake -S . -B build -A Win32 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x86-windows-static

      - name: Build (Release)
        shell: pwsh
        run: cmake --build build --config Release

      - name: Show result
        shell: pwsh
        run: Get-ChildItem build\Release\MVision.dll | Format-List Name,Length,LastWriteTime

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: MVision-x86
          path: build/Release/MVision.dll
          if-no-files-found: error

      - name: Attach DLL to Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Release/MVision.dll

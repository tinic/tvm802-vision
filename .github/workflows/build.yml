name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the DLL to a Release on tag builds

env:
  # vcpkg binary cache so OpenCV is built once and reused on later runs.
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare vcpkg binary-cache dir
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-opencv4-x86-static-v1-${{ runner.os }}

      # Static x86 OpenCV -> the resulting MVision.dll is self-contained (no
      # OpenCV runtime DLLs). First run builds OpenCV (slow); cached afterward.
      - name: Install OpenCV (x86 static)
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install opencv4:x86-windows-static

      - name: Configure (x86, static CRT)
        shell: pwsh
        run: |
          $ocv = "$env:VCPKG_INSTALLATION_ROOT\installed\x86-windows-static"
          cmake -S . -B build -A Win32 `
            -DOpenCV_DIR="$ocv\share\opencv4" `
            -DCMAKE_PREFIX_PATH="$ocv"

      - name: Build (Release)
        shell: pwsh
        run: cmake --build build --config Release

      - name: Show result
        shell: pwsh
        run: Get-ChildItem build\Release\MVision.dll | Format-List Name,Length,LastWriteTime

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: MVision-x86
          path: build/Release/MVision.dll
          if-no-files-found: error

      - name: Attach DLL to Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Release/MVision.dll

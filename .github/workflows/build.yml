name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the DLL to a Release on tag builds

env:
  # vcpkg binary cache so OpenCV is built once and reused on later runs.
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache
  VCPKG_DEFAULT_TRIPLET: x86-windows-static

jobs:
  # Required code-quality gate: formatting, static analysis, and the host-arch
  # build + tests. The portable detector core is also clang-tidy'd here; the
  # Windows-GDI translation units are warnings-as-errors-checked by the `build`
  # job's MSVC /W4 /WX build (they need <windows.h>). Mirrored locally by
  # tools/check.sh.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # constixel submodule for mvision-tune; without this the cmake
          # configure prints a warning and skips the mvision-tune target.
          submodules: recursive

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-format clang-tidy cppcheck cmake g++ \
            libopencv-dev

      - name: clang-format (style)
        run: clang-format --dry-run --Werror src/*.cpp src/*.h

      - name: cppcheck (static analysis)
        run: |
          cppcheck --enable=all --std=c++17 --language=c++ -I src \
            --suppress=missingIncludeSystem --suppress=checkersReport \
            --suppress=normalCheckLevelMaxBranches --suppress=unmatchedSuppression \
            --suppress=unusedFunction --error-exitcode=2 src

      - name: Configure (host tests + compile DB)
        run: cmake -S . -B build-lint -DBUILD_TESTS=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: clang-tidy (portable, Windows-free TUs)
        run: clang-tidy -p build-lint src/detect_common.cpp src/detect_circle.cpp src/detect_contour.cpp src/detect_template.cpp src/detect_symmetry.cpp src/detect_component.cpp src/settings.cpp src/thread_pool.cpp

      - name: Build + test (host arch)
        run: |
          cmake --build build-lint
          ctest --test-dir build-lint --output-on-failure

  # macOS cross-platform validation: mvision-tune is the only target that
  # builds here (the MVision.dll path is Windows/MSVC x86 only). Pure source-
  # only check that the offline tuner stays buildable on macOS via Homebrew
  # OpenCV. No artifacts uploaded.
  tune-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install OpenCV
        run: brew install opencv

      - name: Configure
        run: cmake -S . -B build

      - name: Build mvision-tune
        run: cmake --build build --target mvision-tune --parallel

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history + tags so `git describe` yields the version
          submodules: recursive  # constixel for mvision-tune

      - name: Prepare vcpkg binary-cache dir
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          # bump the suffix to invalidate (e.g. when features change)
          key: vcpkg-opencv4-min-x86-static-v2-${{ runner.os }}

      # Pin the manifest baseline to this runner's vcpkg checkout so the
      # manifest install resolves without a hand-picked commit SHA.
      - name: Pin vcpkg baseline
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" x-update-baseline --add-initial-baseline

      # Configure triggers a manifest-mode vcpkg install of the MINIMAL OpenCV
      # declared in vcpkg.json (core/imgproc/imgcodecs+png, no dnn -> no
      # protobuf), then configures the x86 static build. Static OpenCV ->
      # MVision.dll is self-contained (no OpenCV runtime DLLs).
      - name: Configure (x86, static, minimal OpenCV + libusb via vcpkg manifest)
        shell: pwsh
        run: |
          cmake -S . -B build -A Win32 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x86-windows-static `
            -DBUILD_SAA7113_TUNE=ON `
            -DBUILD_MVISION_GRABBER=ON

      - name: Build (Release)
        shell: pwsh
        run: cmake --build build --config Release

      - name: Show result
        shell: pwsh
        run: Get-ChildItem build\Release\*.dll,build\Release\*.ax,build\Release\*.exe | Format-List Name,Length,LastWriteTime

      - name: Stage release bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bundle | Out-Null
          Copy-Item build\Release\MVision.dll          bundle\
          Copy-Item build\Release\MVision-noavx2.dll   bundle\
          Copy-Item build\Release\mvision_grabber.ax   bundle\
          Copy-Item build\Release\saa7113-tune.exe     bundle\
          Copy-Item install\install.bat                bundle\
          Copy-Item install\uninstall.bat              bundle\
          Copy-Item install\INSTALL.md                 bundle\
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF -replace 'refs/tags/','' } else { 'dev' }
          Compress-Archive -Path bundle\* -DestinationPath "tvm802-vision-$tag.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MVision-x86
          path: |
            build/Release/MVision.dll
            build/Release/MVision-noavx2.dll
            build/Release/mvision_grabber.ax
            build/Release/saa7113-tune.exe
          if-no-files-found: error

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: tvm802-vision-bundle
          path: tvm802-vision-*.zip
          if-no-files-found: error

      - name: Attach release zip + raw binaries (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tvm802-vision-*.zip
            build/Release/MVision.dll
            build/Release/MVision-noavx2.dll
            build/Release/mvision_grabber.ax
            build/Release/saa7113-tune.exe
          generate_release_notes: true
          body: |
            ## tvm802-vision — TVM802A / TVM802B vision replacement

            Download **`tvm802-vision-<TAG>.zip`** and follow `INSTALL.md` inside.
            The zip contains the MVision.dll detector replacement, the
            mvision_grabber.ax DirectShow filter (for real-hardware
            brightness / contrast / gain through the Ctrl+Alt+M Camera tab),
            saa7113-tune.exe (standalone tuner), install.bat / uninstall.bat,
            and INSTALL.md.

            If you only want the detector improvements (no chip-level camera
            control), the raw binaries are also attached individually:
            - **`MVision.dll`** — AVX2, any CPU from ~2015 on (Haswell / Zen+)
            - **`MVision-noavx2.dll`** — SSE2 baseline; required on the
              TVM802BX's Atom N2800.

            Built x86, static OpenCV + libusb (self-contained).
